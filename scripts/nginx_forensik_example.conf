# Contoh potongan konfigurasi nginx untuk boundary HTTP (bukan salinan production lengkap).
# Pasang dengan: nginx di host, upstream ke Flask (mis. 127.0.0.1:5001).
# Lihat METODOLOGI_FORENSIK_JARINGAN.md untuk korelasi access log ↔ forensic_log.txt.

# log_format di dalam blok http { }:
# log_format forensik_json escape=json
#   '{'
#     '"time":"$time_iso8601",'
#     '"remote_addr":"$remote_addr",'
#     '"method":"$request_method",'
#     '"uri":"$request_uri",'
#     '"status":$status,'
#     '"bytes_sent":$body_bytes_sent,'
#     '"request_time":$request_time,'
#     '"ua":"$http_user_agent"'
#   '}';
